{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - CampusConnect</title>

<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>
.brand-font { font-family: "Bitcount Grid Double", system-ui; letter-spacing:2px; }
body { font-family: 'Inter', sans-serif; transition: 0.3s; }
#sidebar { width:250px; }

.card { background:white; border:1px solid black; border-radius:12px; padding:1.25rem; }
.button { background:black; color:white; padding:0.5rem 1rem; border-radius:8px; }
.button:hover { opacity:0.85; }

.table { width:100%; border-collapse:collapse; }
.table th,.table td { padding:0.75rem; border-bottom:1px solid #ddd; }

.table-scroll { max-height:400px; overflow:auto; }

.modal-overlay {
position:fixed; inset:0;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.dark-mode { background:#0f172a; color:white; }
.dark-mode .card { background:#1e293b; }
</style>
</head>

<body class="flex">

<script src="{% static 'js/app.js' %}?v=2"></script>
<script> checkAuthAndRedirect(); </script>

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between">
<div>
<div class="flex items-center gap-3 mb-8">
<img src="{% static 'assets/logo/lo.jpg' %}" class="w-10 h-10 object-contain">
<span class="brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4">
<a href="/dashboard/admin_dashboard/">Dashboard</a>
<a href="/dashboard/admin_dashboard/students.html" class="font-semibold">Students</a>
<a href="/dashboard/admin_dashboard/rooms.html">Rooms</a>
<a href="/dashboard/admin_dashboard/fees.html">Fees</a>
<a href="/dashboard/admin_dashboard/notices.html">Notices</a>
<a href="/dashboard/admin_dashboard/complaints.html">Complaints</a>
</nav>
</div>

<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<!-- MAIN -->
<div id="mainContent" class="flex-1 ml-[250px] p-8">

<h1 class="text-2xl font-semibold mb-6">Students Management</h1>

<div class="flex justify-end mb-6">
<button class="button" onclick="openAddStudentModal()">Add Student</button>
</div>

<div id="loading">Loading students...</div>

<div class="card table-scroll" id="table-container" style="display:none;">
<table class="table">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Roll No</th>
<th>Room</th>
<th>Phone</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="students-tbody"></tbody>
</table>
</div>

</div>

<!-- MODAL -->
<div id="addStudentModal" class="modal-overlay">
<div class="card w-[90%] max-w-[500px]">

<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-semibold">Add New Student</h2>
<button onclick="closeAddStudentModal()">✕</button>
</div>

<form id="addStudentForm" class="space-y-4">

<input id="nameInput" type="text" placeholder="Name" required class="w-full border p-2 rounded">
<input id="emailInput" type="email" placeholder="Email" required class="w-full border p-2 rounded">
<input id="rollInput" type="text" placeholder="Roll No" required class="w-full border p-2 rounded">
<input id="phoneInput" type="text" placeholder="Phone" required class="w-full border p-2 rounded">
<input id="passwordInput" type="password" placeholder="Password" required class="w-full border p-2 rounded">

<select id="roomSelect" class="w-full border p-2 rounded">
<option value="">Select Available Room</option>
</select>

<button type="submit" class="button w-full">Add Student</button>

</form>
</div>
</div>

<script>

setActiveNavLink("students");

/* ================= LOAD STUDENTS ================= */

async function loadStudents() {

const data = await fetchStudents();
document.getElementById("loading").style.display = "none";

if (!data || data.length === 0) {
document.getElementById("table-container").innerHTML =
'<div class="text-center p-4">No students found</div>';
return;
}

let rows = '';

data.forEach(student => {

const statusBadge = student.is_active
? '<span style="color:green;font-weight:600;">Active</span>'
: '<span style="color:red;font-weight:600;">Inactive</span>';

rows += `
<tr>
<td><strong>${student.name}</strong></td>
<td>${student.email}</td>
<td>${student.roll_no}</td>
<td>${student.room_no || "Not Assigned"}</td>
<td>${student.phone || "-"}</td>
<td>${statusBadge}</td>
<td>
<button class="button" onclick="toggleStudent('${student.id}')">Toggle</button>
<button class="button" onclick="deleteStudent('${student.id}')">Delete</button>
</td>
</tr>
`;
});

document.getElementById("students-tbody").innerHTML = rows;
document.getElementById("table-container").style.display = "block";
}

/* ================= AVAILABLE ROOMS ================= */

async function loadAvailableRooms() {

const response = await fetch(`${API_URL}/rooms/available/`);
const rooms = await response.json();

const select = document.getElementById("roomSelect");
select.innerHTML = '<option value="">Select Available Room</option>';

rooms.forEach(room => {
const option = document.createElement("option");
option.value = room.room_no;
option.textContent = `${room.room_no} (${room.occupied}/${room.capacity})`;
select.appendChild(option);
});
}

/* ================= MODAL ================= */

function openAddStudentModal() {
document.getElementById("addStudentModal").style.display = "flex";
loadAvailableRooms();
}

function closeAddStudentModal() {
document.getElementById("addStudentModal").style.display = "none";
}

/* ================= CREATE STUDENT ================= */

document.getElementById("addStudentForm").addEventListener("submit", async function(e) {

e.preventDefault();

const studentData = {
name: document.getElementById("nameInput").value,
email: document.getElementById("emailInput").value,
password: document.getElementById("passwordInput").value,
roll_no: document.getElementById("rollInput").value,
phone: document.getElementById("phoneInput").value,
room_no: document.getElementById("roomSelect").value
};

const response = await fetch(`${API_URL}/students/create/`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(studentData)
});

const result = await response.json();

if (response.ok) {
alert("Student added successfully");
closeAddStudentModal();
loadStudents();
this.reset();
} else {
alert(result.message || "Error creating student");
}
});

/* ================= ACTIONS ================= */

async function toggleStudent(id) {
await fetch(`${API_URL}/students/toggle/${id}/`, { method: "PUT" });
loadStudents();
}

async function deleteStudent(id) {
if (!confirm("Delete this student?")) return;
await fetch(`${API_URL}/students/delete/${id}/`, { method: "DELETE" });
loadStudents();
}

/* INIT */
loadStudents();

</script>
</body>
</html>
