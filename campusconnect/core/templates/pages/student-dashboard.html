{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>

    .brand-font {
font-family: "Bitcount Grid Double", system-ui;
font-size: medium;
font-weight: 100;
letter-spacing: 2px;
}
body {
font-family: 'Inter', sans-serif;
transition: background 0.3s ease, color 0.3s ease;
}

/* Sidebar */
#sidebar { width: 250px; }

/* Cards */
.card {
background: white;
border: 1px solid black;
border-radius: 12px;
padding: 1.25rem;
}

/* Buttons */
.button {
background: black;
color: white;
padding: 0.5rem 1rem;
border-radius: 8px;
transition: opacity 0.2s ease;
display: inline-block;
text-align: center;
}

.button:hover { opacity: 0.85; }

/* Dark Mode */
.dark-mode {
background: #0f172a;
color: white;
}

.dark-mode .card {
background: #1e293b;
border: 1px solid black;
}
</style>
</head>

<body class="flex">

<script src="{% static 'js/app.js' %}?v=2"></script>
<script>
checkAuthAndRedirect();

if (getUserRole() !== "student") {
window.location.href = "/dashboard/admin_dashboard/";
}

// Extract user_id from URL
const userId = window.location.pathname.split('/')[3];
</script>

<!-- Sidebar -->
<aside id="sidebar"
class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between transform transition-transform duration-300">

<div>
<div class="flex items-center gap-3 mb-8">
<img src="{% static 'assets/logo/lo.jpg' %}" class="w-10 h-10 object-contain">
<span class="text-lg text-white brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4" id="student-nav">
<!-- Nav links populated by JavaScript -->
</nav>
</div>

<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<script>
// Populate student navigation links
document.getElementById('student-nav').innerHTML = `
<a href="/student/dashboard/${userId}/" class="font-semibold">Dashboard</a>
<a href="/student/dashboard/${userId}/rules.html">Rules</a>
<a href="/student/dashboard/${userId}/fees.html">Fees</a>
<a href="/student/dashboard/${userId}/notices.html">Notices</a>
<a href="/student/dashboard/${userId}/complaints.html">Complaints</a>
`;
</script><!-- Main Content -->
<div id="mainContent" class="flex-1 ml-[250px] p-8 transition-all duration-300">

<!-- Top Bar -->
<div class="flex items-center mb-8 relative">
<button onclick="toggleSidebar()" class="button">☰</button>

<h1 class="absolute left-1/2 transform -translate-x-1/2 text-2xl font-semibold">
Dashboard
</h1>

<div class="ml-auto">
<label class="flex items-center cursor-pointer">
<input type="checkbox" id="themeToggle" class="hidden">
<div class="w-12 h-6 bg-gray-300 rounded-full relative transition">
<div id="toggleCircle"
class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition"></div>
</div>
</label>
</div>
</div>

<div id="error-container"></div>

<div id="loading" class="mb-4">Loading dashboard...</div>

<div id="dashboard-content" style="display:none;">

<div class="grid grid-cols-3 gap-6">

<!-- PROFILE -->
<div class="card">
<h3 class="font-semibold mb-4">My Profile</h3>
<div id="profile-content"></div>
</div>

<!-- FEES -->
<div class="card">
<h3 class="font-semibold mb-4">Fees Summary</h3>
<div id="fees-content"></div>
</div>

<!-- ROOM -->
<div class="card">
<h3 class="font-semibold mb-4">Room Info</h3>
<div id="room-content"></div>
</div>

</div>

<!-- NOTICE -->
<div class="card mt-6" id="notice-card" style="display:none;">
<h3 class="font-semibold mb-4">Latest Notice</h3>
<div id="notice-content"></div>
</div>

<!-- COMPLAINT -->
<div class="card mt-6" id="complaint-card" style="display:none;">
<h3 class="font-semibold mb-4">Latest Complaint</h3>
<div id="complaint-content"></div>
</div>

</div>

</div>

<script>

/* Sidebar Toggle */
const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");
let isOpen = true;

function toggleSidebar() {
if (isOpen) {
sidebar.style.transform = "translateX(-100%)";
mainContent.style.marginLeft = "0";
} else {
sidebar.style.transform = "translateX(0)";
mainContent.style.marginLeft = "250px";
}
isOpen = !isOpen;
}

/* Dark Mode */
const toggle = document.getElementById("themeToggle");
const circle = document.getElementById("toggleCircle");

toggle.addEventListener("change", () => {
document.body.classList.toggle("dark-mode");
circle.style.transform = toggle.checked ? "translateX(24px)" : "translateX(0)";
});

/* ===== ORIGINAL LOGIC (UNCHANGED) ===== */

setActiveNavLink("dashboard");

async function loadStudentDashboard() {

const userId = getUserId();
if (!userId) {
showError("User session invalid.");
return;
}

try {

const dashboardData = await fetch(`${API_URL}/student/dashboard/${userId}/`)
.then(res => res.json());

const latestNotice = await fetchLatestNotice();
const latestComplaint = await fetchLatestComplaint(userId);

document.getElementById("loading").style.display = "none";
document.getElementById("dashboard-content").style.display = "block";

/* PROFILE */
document.getElementById("profile-content").innerHTML = `
<p><strong>Name:</strong> ${dashboardData.name || "-"}</p>
<p><strong>Email:</strong> ${dashboardData.email || "-"}</p>
`;

/* FEES */
const paid = dashboardData.fees_paid;
const total = dashboardData.total_fees || 0;
const pending = dashboardData.pending_fees || 0;
const statusColor = paid ? "green" : "red";

document.getElementById("fees-content").innerHTML = `
<div style="text-align:center;">
<h2 style="color:${statusColor};">
${paid ? "All Fees Paid" : "Pending Fees"}
</h2>
<p>Total: ${formatCurrency(total)}</p>
<p>Pending: ${formatCurrency(pending)}</p>
<a href="/student/dashboard/${userId}/fees.html" class="button w-full mt-6">
View Full Details
</a>
</div>
`;

/* ROOM */
if (dashboardData.room_no) {
document.getElementById("room-content").innerHTML = `
<p><strong>Room Number:</strong> ${dashboardData.room_no}</p>
<p><strong>Capacity:</strong> ${dashboardData.room_capacity}</p>
<p><strong>Occupied:</strong> ${dashboardData.room_occupied}</p>
`;
} else {
document.getElementById("room-content").innerHTML =
`<p style="color:red;">Room not assigned yet.</p>`;
}

/* NOTICE */
if (latestNotice && latestNotice.title) {
document.getElementById("notice-card").style.display = "block";
document.getElementById("notice-content").innerHTML = `
<h3>${latestNotice.title}</h3>
<p>${formatDate(latestNotice.created_at)}</p>
<p>${latestNotice.description}</p>
`;
}

/* COMPLAINT */
if (latestComplaint && latestComplaint.title) {
document.getElementById("complaint-card").style.display = "block";
document.getElementById("complaint-content").innerHTML = `
<h3>${latestComplaint.title}</h3>
<p>${formatDate(latestComplaint.created_at)}</p>
<p>Status: ${latestComplaint.status}</p>
`;
}

} catch (error) {
console.error(error);
showError("Failed to load dashboard.");
}
}

loadStudentDashboard();

</script>

</body>
</html>
