{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rooms - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>
  .brand-font {
font-family: "Bitcount Grid Double", system-ui;
font-size: medium;
font-weight: 100;
letter-spacing: 2px;
}
body {
font-family: 'Inter', sans-serif;
transition: background 0.3s ease, color 0.3s ease;
}

/* Sidebar */
#sidebar { width: 250px; }

/* Cards */
.card {
background: white;
border: 1px solid black;
border-radius: 12px;
padding: 1.25rem;
}

/* Buttons */
.button {
background: black;
color: white;
padding: 0.5rem 1rem;
border-radius: 8px;
transition: opacity 0.2s ease;
}

.button:hover { opacity: 0.85; }

.button-secondary { background: black; }
.button-danger { background: black; }

/* Table */
.table {
width: 100%;
border-collapse: collapse;
min-width: 900px;
}

.table th, .table td {
padding: 0.75rem;
border-bottom: 1px solid #ddd;
text-align: left;
}

/* Scrollable container */
.table-scroll {
max-height: 450px;
overflow-y: auto;
overflow-x: auto;
}

/* Modal */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.5);
display: none;
align-items: center;
justify-content: center;
z-index: 1000;
}

/* Dark Mode */
.dark-mode {
background: #0f172a;
color: white;
}

.dark-mode .card {
background: #1e293b;
border: 1px solid black;
}

.dark-mode .table th,
.dark-mode .table td {
border-bottom: 1px solid #333;
}
</style>
</head>

<body class="flex">

<script src="{% static 'js/app.js' %}?v=2"></script>
<script>
checkAuthAndRedirect();
</script>

<!-- Sidebar -->
<aside id="sidebar"
class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between transform transition-transform duration-300">

<div>
<div class="flex items-center gap-3 mb-8">
<img src="{% static 'assets/logo/lo.jpg' %}" class="w-10 h-10 object-contain">
<span class="text-lg text-white brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4">
<a href="/dashboard/admin_dashboard/">Dashboard</a>
<a href="/dashboard/admin_dashboard/students.html">Students</a>
<a href="/dashboard/admin_dashboard/rooms.html" class="font-semibold">Rooms</a>
<a href="/dashboard/admin_dashboard/fees.html">Fees</a>
<a href="/dashboard/admin_dashboard/notices.html">Notices</a>
<a href="/dashboard/admin_dashboard/complaints.html">Complaints</a>

</nav>
</div>

<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<!-- Main Content -->
<div id="mainContent" class="flex-1 ml-[250px] p-8 transition-all duration-300">

<!-- Top Bar -->
<div class="flex items-center mb-8 relative">
<button onclick="toggleSidebar()" class="button">☰</button>

<h1 class="absolute left-1/2 transform -translate-x-1/2 text-2xl font-semibold">
Rooms Management
</h1>

<div class="ml-auto">
<label class="flex items-center cursor-pointer">
<input type="checkbox" id="themeToggle" class="hidden">
<div class="w-12 h-6 bg-gray-300 rounded-full relative transition">
<div id="toggleCircle"
class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition"></div>
</div>
</label>
</div>
</div>

<div class="flex justify-end mb-6">
<button class="button" onclick="openAddRoomModal()">Add Room</button>
</div>

<div id="error-container"></div>

<div id="loading" class="mb-4">Loading rooms...</div>

<div class="card table-scroll" id="table-container" style="display:none;">
<table class="table">
<thead>
<tr>
<th>Room No</th>
<th>Capacity</th>
<th>Occupied</th>
<th>Students</th>
<th>Progress</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="rooms-tbody"></tbody>
</table>
</div>

</div>

<!-- Add Room Modal -->
<div id="addRoomModal" class="modal-overlay">
<div class="card" style="width:90%; max-width:500px;">
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-semibold">Add New Room</h2>
<button onclick="closeAddRoomModal()">✕</button>
</div>

<form id="addRoomForm" class="space-y-4">
<input type="text" placeholder="Room Number" required class="w-full border p-2 rounded">
<input type="number" placeholder="Capacity" required class="w-full border p-2 rounded">
<button type="submit" class="button w-full">Add Room</button>
</form>
</div>
</div>

<script>

/* Sidebar Toggle */
const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");
let isOpen = true;

function toggleSidebar() {
if (isOpen) {
sidebar.style.transform = "translateX(-100%)";
mainContent.style.marginLeft = "0";
} else {
sidebar.style.transform = "translateX(0)";
mainContent.style.marginLeft = "250px";
}
isOpen = !isOpen;
}

/* Dark Mode */
const toggle = document.getElementById("themeToggle");
const circle = document.getElementById("toggleCircle");

toggle.addEventListener("change", () => {
document.body.classList.toggle("dark-mode");
circle.style.transform = toggle.checked ? "translateX(24px)" : "translateX(0)";
});

/* ===== ORIGINAL LOGIC (UNCHANGED) ===== */

setActiveNavLink("rooms");

function openAddRoomModal() {
document.getElementById("addRoomModal").style.display = "flex";
}

function closeAddRoomModal() {
document.getElementById("addRoomModal").style.display = "none";
}

async function loadRooms() {

const data = await fetchRooms();
document.getElementById("loading").style.display = "none";

if (!data || data.length === 0) {
document.getElementById("table-container").innerHTML =
'<div class="text-center">No rooms found</div>';
return;
}

let rows = '';

data.forEach(room => {

const percent = room.capacity > 0
? Math.min((room.occupied / room.capacity) * 100, 100)
: 0;

let studentList = "No students";

if (room.students && room.students.length) {
studentList = room.students.map(s => `${s.name}`).join("<br>");
}

rows += `
<tr>
<td><strong>${room.room_no}</strong></td>
<td>${room.capacity}</td>
<td>${room.occupied}/${room.capacity}</td>
<td>${studentList}</td>
<td>
<div style="width:120px;height:8px;background:#eee;border-radius:4px;">
<div style="width:${percent}%;height:100%;background:black;"></div>
</div>
</td>
<td>
<button class="button"
onclick="editCapacity('${room.id}', '${room.capacity}')">Edit</button>
<button class="button"
onclick="deleteRoom('${room.id}')">Delete</button>
</td>
</tr>
`;
});

document.getElementById("rooms-tbody").innerHTML = rows;
document.getElementById("table-container").style.display = "block";
}

document.getElementById("addRoomForm").addEventListener("submit", async function (e) {
e.preventDefault();

const inputs = this.querySelectorAll("input");

const roomData = {
room_no: inputs[0].value,
capacity: inputs[1].value
};

const response = await fetch(`${API_URL}/rooms/create/`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(roomData)
});

const result = await response.json();

if (response.ok) {
closeAddRoomModal();
loadRooms();
this.reset();
} else {
showError(result.message || "Failed to create room");
}
});

async function editCapacity(id, currentCapacity) {
const newCapacity = prompt("Enter new capacity:", currentCapacity);
if (!newCapacity) return;

await fetch(`${API_URL}/rooms/update/${id}/`, {
method: "PUT",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ capacity: newCapacity })
});

loadRooms();
}

async function deleteRoom(id) {
if (!confirm("Delete this room?")) return;

await fetch(`${API_URL}/rooms/delete/${id}/`, { method: "DELETE" });

loadRooms();
}

loadRooms();

</script>

</body>
</html>
