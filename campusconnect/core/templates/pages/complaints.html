{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complaints - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>

  .brand-font {
font-family: "Bitcount Grid Double", system-ui;
font-size: medium;
font-weight: 100;
letter-spacing: 2px;
}

body {
font-family: 'Inter', sans-serif;
transition: background 0.3s ease, color 0.3s ease;
}

/* Sidebar */
#sidebar { width: 250px; }

/* Cards */
.card {
background: white;
border: 1px solid black;
border-radius: 12px;
padding: 1.25rem;
}

/* Buttons */
.button {
background: black;
color: white;
padding: 0.5rem 1rem;
border-radius: 8px;
transition: opacity 0.2s ease;
}

.button:hover { opacity: 0.85; }

/* Scrollable complaints container */
.complaint-scroll {
max-height: 520px;
overflow-y: auto;
}

/* Modal */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.5);
display: none;
align-items: center;
justify-content: center;
z-index: 1000;
}

/* Dark Mode */
.dark-mode {
background: #0f172a;
color: white;
}

.dark-mode .card {
background: #1e293b;
border: 1px solid black;
}
</style>
</head>

<body class="flex">

<script src="{% static 'js/app.js' %}?v=2"></script>
<script>
checkAuthAndRedirect();
</script>

<!-- Sidebar -->
<aside id="sidebar"
class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between transform transition-transform duration-300">

<div>
<div class="flex items-center gap-3 mb-8">
<img src="{% static 'assets/logo/lo.jpg' %}" class="w-10 h-10 object-contain">
<span class="text-lg text-white brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4">
<a href="/dashboard/admin_dashboard/">Dashboard</a>
<a href="/dashboard/admin_dashboard/students.html">Students</a>
<a href="/dashboard/admin_dashboard/rooms.html">Rooms</a>
<a href="/dashboard/admin_dashboard/fees.html">Fees</a>
<a href="/dashboard/admin_dashboard/notices.html">Notices</a>
<a href="/dashboard/admin_dashboard/complaints.html" class="font-semibold">Complaints</a>

</nav>
</div>

<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<!-- Main Content -->
<div id="mainContent" class="flex-1 ml-[250px] p-8 transition-all duration-300">

<!-- Top Bar -->
<div class="flex items-center mb-8 relative">
<button onclick="toggleSidebar()" class="button">☰</button>

<h1 class="absolute left-1/2 transform -translate-x-1/2 text-2xl font-semibold">
Complaints Management
</h1>

<div class="ml-auto">
<label class="flex items-center cursor-pointer">
<input type="checkbox" id="themeToggle" class="hidden">
<div class="w-12 h-6 bg-gray-300 rounded-full relative transition">
<div id="toggleCircle"
class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition"></div>
</div>
</label>
</div>
</div>

<div id="error-container"></div>

<div id="loading" class="mb-4">Loading complaints...</div>

<div id="complaints-container" class="complaint-scroll"></div>

</div>

<!-- Modal -->
<div id="complaintModal" class="modal-overlay">
<div class="card" style="width:90%; max-width:600px;">
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-semibold">Complaint Details</h2>
<button onclick="closeComplaintModal()">✕</button>
</div>

<div id="modalContent"></div>
</div>
</div>

<script>

/* Sidebar Toggle */
const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");
let isOpen = true;

function toggleSidebar() {
if (isOpen) {
sidebar.style.transform = "translateX(-100%)";
mainContent.style.marginLeft = "0";
} else {
sidebar.style.transform = "translateX(0)";
mainContent.style.marginLeft = "250px";
}
isOpen = !isOpen;
}

/* Dark Mode */
const toggle = document.getElementById("themeToggle");
const circle = document.getElementById("toggleCircle");

toggle.addEventListener("change", () => {
document.body.classList.toggle("dark-mode");
circle.style.transform = toggle.checked ? "translateX(24px)" : "translateX(0)";
});

/* ===== ORIGINAL LOGIC BELOW (UNCHANGED) ===== */

setActiveNavLink("complaints");

let complaintsCache = [];
let selectedComplaint = null;

async function loadComplaints() {

const data = await fetchComplaints();
document.getElementById("loading").style.display = "none";

if (!data || data.length === 0) {
document.getElementById("complaints-container").innerHTML =
'<div class="card text-center">No complaints found</div>';
return;
}

complaintsCache = data;

let html = '';

data.forEach(c => {

const statusColor = {
"pending": "#e74c3c",
"in-progress": "#f39c12",
"resolved": "#27ae60"
}[c.status] || "#3498db";

html += `
<div class="card mb-4">
<div class="flex justify-between items-start">
<div>
<h3 class="font-semibold">${c.title}</h3>
<p class="text-sm opacity-70">
${formatDate(c.created_at)} • Student: ${c.student_name}
</p>
</div>
<span style="background:${statusColor};color:white;padding:4px 10px;border-radius:4px;">
${c.status.toUpperCase()}
</span>
</div>

<div class="mt-4">
<p>${c.description}</p>
<div class="mt-4">
<button class="button"
onclick="openComplaintModal(${c.id})">
View Details
</button>
</div>
</div>
</div>
`;
});

document.getElementById("complaints-container").innerHTML = html;
}

function openComplaintModal(id) {

selectedComplaint = complaintsCache.find(c => c.id === id);
if (!selectedComplaint) return;

document.getElementById("modalContent").innerHTML = `
<p><strong>Title:</strong> ${selectedComplaint.title}</p>
<p><strong>Description:</strong> ${selectedComplaint.description}</p>
<p><strong>Student:</strong> ${selectedComplaint.student_name}</p>
<p><strong>Status:</strong> ${selectedComplaint.status}</p>

<div style="margin-top:1.5rem; display:flex; gap:1rem; flex-wrap:wrap;">

<button onclick="changeStatus('pending')" class="button">Pending</button>
<button onclick="changeStatus('in-progress')" class="button">In Progress</button>
<button onclick="changeStatus('resolved')" class="button">Resolved</button>

</div>
`;

document.getElementById("complaintModal").style.display = "flex";
}

function closeComplaintModal() {
document.getElementById("complaintModal").style.display = "none";
}

async function changeStatus(status) {

if (!selectedComplaint) return;

await fetch(`${API_URL}/complaints/update/${selectedComplaint.id}/`, {
method: "PUT",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ status: status })
});

closeComplaintModal();
loadComplaints();
}

loadComplaints();

</script>

</body>
</html>
