{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fees - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>
.brand-font { font-family: "Bitcount Grid Double", system-ui; letter-spacing:2px; }
body { font-family:'Inter',sans-serif; }
#sidebar { width:250px; }

.card { background:white; border:1px solid black; border-radius:12px; padding:1.25rem; }
.button { background:black; color:white; padding:0.5rem 1rem; border-radius:8px; }
.button:hover { opacity:0.85; }

.table { width:100%; border-collapse:collapse; min-width:800px; }
.table th,.table td { padding:0.75rem; border-bottom:1px solid #ddd; }

.table-scroll { max-height:450px; overflow:auto; }

.modal-overlay {
position:fixed; inset:0;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}
</style>
</head>

<body class="flex">

<script src="{% static 'js/app.js' %}?v=2"></script>
<script>checkAuthAndRedirect();</script>

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between">

<div>
<div class="flex items-center gap-3 mb-8">
<img src="{% static 'assets/logo/lo.jpg' %}" class="w-10 h-10 object-contain">
<span class="brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4">
<a href="/dashboard/admin_dashboard/">Dashboard</a>
<a href="/dashboard/admin_dashboard/students.html">Students</a>
<a href="/dashboard/admin_dashboard/rooms.html">Rooms</a>
<a href="/dashboard/admin_dashboard/fees.html" class="font-semibold">Fees</a>
<a href="/dashboard/admin_dashboard/notices.html">Notices</a>
<a href="/dashboard/admin_dashboard/complaints.html">Complaints</a>
</nav>
</div>

<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<!-- MAIN -->
<div id="mainContent" class="flex-1 ml-[250px] p-8">

<h1 class="text-2xl font-semibold mb-6">Fees Management</h1>

<div class="flex justify-end mb-6">
<button class="button" onclick="openCreateFeeModal()">Create Fee</button>
</div>

<div id="loading">Loading fees...</div>

<div class="grid grid-cols-3 gap-6 mb-6" id="summary-container" style="display:none;"></div>

<div class="card table-scroll" id="table-container" style="display:none;">
<table class="table">
<thead>
<tr>
<th>Student</th>
<th>Amount</th>
<th>Status</th>
<th>Semester</th>
<th>Due Date</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="fees-tbody"></tbody>
</table>
</div>

</div>

<!-- CREATE FEE MODAL -->
<div id="createFeeModal" class="modal-overlay">
<div class="card" style="width:90%; max-width:500px;">

<div class="flex justify-between items-center mb-4">
<h2>Create Fee</h2>
<button onclick="closeCreateFeeModal()">✕</button>
</div>

<form id="createFeeForm" class="space-y-4">

<select id="studentSelect" required class="w-full border p-2 rounded"></select>

<input type="number" id="feeAmount" placeholder="Amount" required class="w-full border p-2 rounded">

<input type="text" id="feeSemester" placeholder="Semester (e.g., 1st Sem)" required class="w-full border p-2 rounded">

<input type="date" id="feeDueDate" required class="w-full border p-2 rounded">

<button type="submit" class="button w-full">Create Fee</button>

</form>

</div>
</div>

<script>

setActiveNavLink("fees");

let feesCache=[];

/* ================= LOAD FEES ================= */

async function loadFees(){

const data=await fetchFees();
document.getElementById("loading").style.display="none";

if(!data||data.length===0) return;

feesCache=data;

const total=data.reduce((s,f)=>s+(f.amount||0),0);
const paid=data.reduce((s,f)=>s+(f.status==="paid"?f.amount:0),0);
const pending=total-paid;

document.getElementById("summary-container").innerHTML=`
<div class="card"><strong>Total</strong><div>${formatCurrency(total)}</div></div>
<div class="card"><strong>Paid</strong><div>${formatCurrency(paid)}</div></div>
<div class="card"><strong>Pending</strong><div>${formatCurrency(pending)}</div></div>
`;
document.getElementById("summary-container").style.display="grid";

let rows='';

data.forEach(fee=>{
rows+=`
<tr>
<td>${fee.student_name}</td>
<td>${formatCurrency(fee.amount)}</td>
<td>${fee.status}</td>
<td>${fee.semester}</td>
<td>${formatDate(fee.due_date)}</td>
<td>
<button class="button" onclick="markAsPaid(${fee.id})">Mark Paid</button>
<button class="button" onclick="deleteFee(${fee.id})">Delete</button>
</td>
</tr>`;
});

document.getElementById("fees-tbody").innerHTML=rows;
document.getElementById("table-container").style.display="block";
}

loadFees();

/* ================= OPEN CREATE MODAL ================= */

async function openCreateFeeModal(){

const res=await fetch(`${API_URL}/students/list_all/`);
const students=await res.json();

const select=document.getElementById("studentSelect");
select.innerHTML='';

students.forEach(s=>{
select.innerHTML+=`<option value="${s.id}">${s.name}</option>`;
});

document.getElementById("createFeeModal").style.display="flex";
}

function closeCreateFeeModal(){
document.getElementById("createFeeModal").style.display="none";
}

/* ================= CREATE FEE ================= */

document.getElementById("createFeeForm").addEventListener("submit",async function(e){

e.preventDefault();

const student_id=document.getElementById("studentSelect").value;
const amount=document.getElementById("feeAmount").value;
const semester=document.getElementById("feeSemester").value;
const due_date=document.getElementById("feeDueDate").value;

const response=await fetch(`${API_URL}/fees/create/`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
student_id,
amount,
semester,
due_date
})
});

const result=await response.json();

if(response.ok){
alert("Fee created successfully");
closeCreateFeeModal();
loadFees();
this.reset();
}else{
alert(result.message||"Error creating fee");
}

});


async function markAsPaid(id){
await fetch(`${API_URL}/fees/mark_paid/${id}/`,{method:"PUT"});
loadFees();
}

async function deleteFee(id){
if(!confirm("Delete this fee?")) return;
await fetch(`${API_URL}/fees/delete/${id}/`,{method:"DELETE"});
loadFees();
}

</script>

</body>
</html>
