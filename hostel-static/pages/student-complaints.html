<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Complaints - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>

    .brand-font {
font-family: "Bitcount Grid Double", system-ui;
font-size: medium;
font-weight: 100;
letter-spacing: 2px;
}
body {
font-family: 'Inter', sans-serif;
transition: background 0.3s ease, color 0.3s ease;
}

/* Sidebar */
#sidebar { width: 250px; }

/* Cards */
.card {
background: white;
border: 1px solid black;
border-radius: 12px;
padding: 1.25rem;
}

/* Buttons */
.button, .logout-btn {
background: black;
color: white;
padding: 0.6rem 1rem;
border-radius: 8px;
transition: opacity 0.2s ease;
display: inline-block;
}

.button:hover, .logout-btn:hover {
opacity: 0.85;
}

/* Scrollable complaints */
.scroll-container {
max-height: 500px;
overflow-y: auto;
padding-right: 8px;
}

/* Dark Mode */
.dark-mode {
background: #0f172a;
color: white;
}

.dark-mode .card {
background: #1e293b;
border: 1px solid black;
}

.dark-mode input,
.dark-mode textarea,
.dark-mode select {
background: #334155;
color: white;
border: 1px solid #475569;
}
</style>
</head>

<body class="flex">

<script src="../js/app.js"></script>
<script>
checkAuthAndRedirect();
if (getUserRole() !== "student") {
window.location.href = "admin-dashboard.html";
}
</script>

<!-- Sidebar -->
<aside id="sidebar"
class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between transform transition-transform duration-300">

<div>
<div class="flex items-center gap-3 mb-8">
<img src="../assets/logo/lo.jpg" class="w-10 h-10 object-contain">
<span class="text-lg text-white brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4">
<a href="student-dashboard.html">Dashboard</a>
<a href="student-rules.html">Rules</a>
<a href="student-fees.html">Fees</a>
<a href="student-notices.html">Notices</a>
<a href="student-complaints.html" class="font-semibold">Complaints</a>
</nav>
</div>

<button class="logout-btn mt-6" onclick="logout()">Logout</button>
</aside>

<!-- Main Content -->
<div id="mainContent" class="flex-1 ml-[250px] p-8 transition-all duration-300">

<!-- Top Bar -->
<div class="flex items-center mb-8 relative">

<button onclick="toggleSidebar()" class="button">☰</button>

<h1 class="absolute left-1/2 transform -translate-x-1/2 text-2xl font-semibold">
My Complaints
</h1>

<div class="ml-auto flex items-center gap-6">
<button class="button" onclick="openComplaintModal()">
➕ File Complaint
</button>

<label class="flex items-center cursor-pointer">
<input type="checkbox" id="themeToggle" class="hidden">
<div class="w-12 h-6 bg-gray-300 rounded-full relative transition">
<div id="toggleCircle"
class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition"></div>
</div>
</label>
</div>
</div>

<div id="error-container"></div>
<div id="success-container"></div>

<div id="loading" class="mb-6">
Loading complaints...
</div>

<!-- Scrollable Complaints -->
<div id="complaints-container" class="scroll-container space-y-4"></div>

</div>

<!-- MODAL -->
<div id="complaintModal"
style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">

<div class="card" style="width:90%; max-width:500px;">
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-semibold">File New Complaint</h2>
<button onclick="closeComplaintModal()" style="background:none;border:none;font-size:1.5rem;">✕</button>
</div>

<form id="complaintForm" class="space-y-4">

<div>
<label>Title</label>
<input type="text" id="complaintTitle" required class="w-full border p-2 rounded">
</div>

<div>
<label>Category</label>
<select id="complaintCategory" required class="w-full border p-2 rounded">
<option value="">Select Category</option>
<option value="maintenance">Maintenance</option>
<option value="cleanliness">Cleanliness</option>
<option value="water">Water Issue</option>
<option value="electricity">Electricity</option>
<option value="wifi">WiFi Issue</option>
<option value="other">Other</option>
</select>
</div>

<div>
<label>Description</label>
<textarea id="complaintDescription" rows="5" required class="w-full border p-2 rounded"></textarea>
</div>

<button type="submit" class="button w-full">
Submit Complaint
</button>

</form>
</div>
</div>

<script>

/* Sidebar Toggle */
const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");
let isOpen = true;

function toggleSidebar() {
if (isOpen) {
sidebar.style.transform = "translateX(-100%)";
mainContent.style.marginLeft = "0";
} else {
sidebar.style.transform = "translateX(0)";
mainContent.style.marginLeft = "250px";
}
isOpen = !isOpen;
}

/* Dark Mode */
const toggle = document.getElementById("themeToggle");
const circle = document.getElementById("toggleCircle");

toggle.addEventListener("change", () => {
document.body.classList.toggle("dark-mode");
circle.style.transform = toggle.checked ? "translateX(24px)" : "translateX(0)";
});

/* ===== ORIGINAL LOGIC (UNCHANGED) ===== */

setActiveNavLink("complaints");

function openComplaintModal() {
document.getElementById("complaintModal").style.display = "flex";
}

function closeComplaintModal() {
document.getElementById("complaintModal").style.display = "none";
}

async function loadComplaints() {
try {
const userId = getUserId();
const response = await fetch(`${API_URL}/complaints/student/${userId}/`);
if (!response.ok) throw new Error("Failed to fetch complaints");

const data = await response.json();
document.getElementById("loading").style.display = "none";

if (!data || data.length === 0) {
document.getElementById("complaints-container").innerHTML =
'<div class="card text-center">No complaints filed yet</div>';
return;
}

let html = '';

data.forEach(c => {
html += `
<div class="card">
<div class="flex justify-between items-center mb-2">
<div>
<h3 class="font-semibold">${c.title}</h3>
<p class="text-sm opacity-70">
${formatDate(c.created_at)} • ${c.category}
</p>
</div>
<span class="text-sm font-medium uppercase">
${c.status}
</span>
</div>
<p>${c.description}</p>
</div>
`;
});

document.getElementById("complaints-container").innerHTML = html;

} catch (error) {
document.getElementById("loading").style.display = "none";
showError("Failed to load complaints.");
console.error(error);
}
}

document.getElementById("complaintForm")
.addEventListener("submit", async function(e) {
e.preventDefault();
try {
const userId = getUserId();
const response = await fetch(`${API_URL}/complaints/create/`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
user_id: userId,
title: document.getElementById("complaintTitle").value,
category: document.getElementById("complaintCategory").value,
description: document.getElementById("complaintDescription").value
})
});

const result = await response.json();
if (!response.ok) throw new Error(result.message);

closeComplaintModal();
showSuccess("Complaint submitted successfully");
this.reset();
loadComplaints();

} catch (error) {
showError("Failed to submit complaint.");
console.error(error);
}
});

loadComplaints();

</script>

</body>
</html>
