<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Fees - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
.brand-font { font-family:"Bitcount Grid Double",system-ui;letter-spacing:2px; }
body { font-family:'Inter',sans-serif; }
#sidebar{width:250px;}

.card{background:white;border:1px solid black;border-radius:12px;padding:1.25rem;}
.button{
background:black;color:white;padding:6px 14px;border-radius:8px;
transition:0.2s;display:inline-block;text-align:center;
}
.button:hover{opacity:0.85;}

.table-wrapper{max-height:400px;overflow:auto;}
</style>
</head>

<body class="flex">

<script src="../js/app.js"></script>
<script>
checkAuthAndRedirect();
if(getUserRole()!=="student"){
window.location.href="admin-dashboard.html";
}
</script>

<!-- Sidebar -->
<aside id="sidebar" class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between">
<div>
<div class="flex items-center gap-3 mb-8">
<img src="../assets/logo/lo.jpg" class="w-10 h-10 object-contain">
<span class="brand-font">CampusConnect</span>
</div>
<nav class="flex flex-col gap-4">
<a href="student-dashboard.html">Dashboard</a>
<a href="student-rules.html">Rules</a>
<a href="student-fees.html" class="font-semibold">Fees</a>
<a href="student-notices.html">Notices</a>
<a href="student-complaints.html">Complaints</a>
</nav>
</div>
<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<!-- Main -->
<div id="mainContent" class="flex-1 ml-[250px] p-8">

<h1 class="text-2xl font-semibold mb-6 text-center">My Fees</h1>

<div id="loading">Loading fees...</div>
<div id="summary-container" class="grid grid-cols-3 gap-6 mb-6 hidden"></div>

<div class="card hidden" id="table-container">
<div class="table-wrapper">
<table class="w-full border-collapse">
<thead>
<tr class="border-b border-black">
<th class="p-2 text-left">Semester</th>
<th class="p-2 text-left">Amount</th>
<th class="p-2 text-left">Status</th>
<th class="p-2 text-left">Due Date</th>
<th class="p-2 text-left">Action</th>
</tr>
</thead>
<tbody id="fees-tbody"></tbody>
</table>
</div>
</div>

</div>

<script>

setActiveNavLink("fees");

async function loadStudentFees(){

const userId=getUserId();
if(!userId) return;

const response=await fetch(`${API_URL}/fees/student/${userId}/`);
const data=await response.json();

document.getElementById("loading").style.display="none";

if(!data||data.length===0){
document.getElementById("loading").innerHTML="No fee records found.";
return;
}

/* SUMMARY */
const total=data.reduce((s,f)=>s+f.amount,0);
const paid=data.filter(f=>f.status==="paid").reduce((s,f)=>s+f.amount,0);
const pending=total-paid;

document.getElementById("summary-container").innerHTML=`
<div class="card"><strong>Total</strong><div>${formatCurrency(total)}</div></div>
<div class="card"><strong style="color:green;">Paid</strong><div>${formatCurrency(paid)}</div></div>
<div class="card"><strong style="color:red;">Pending</strong><div>${formatCurrency(pending)}</div></div>
`;
document.getElementById("summary-container").classList.remove("hidden");

/* TABLE */
let rows='';

data.forEach(fee=>{

const badgeColor=fee.status==="paid"?"#27ae60":"#e67e22";

rows+=`
<tr class="border-b border-gray-200">
<td class="p-2">${fee.semester||"N/A"}</td>
<td class="p-2">${formatCurrency(fee.amount)}</td>
<td class="p-2">
<span style="background:${badgeColor};color:white;padding:4px 10px;border-radius:4px;">
${fee.status.toUpperCase()}
</span>
</td>
<td class="p-2">${formatDate(fee.due_date)}</td>
<td class="p-2">
${fee.status==="pending"
? `<button class="button" onclick="payNow(${fee.id})">Pay Now</button>`
: `<button class="button" onclick="downloadReceipt(${fee.id})">Receipt</button>`}
</td>
</tr>
`;
});

document.getElementById("fees-tbody").innerHTML=rows;
document.getElementById("table-container").classList.remove("hidden");
}

loadStudentFees();

/* ===== PAYMENT ===== */

async function payNow(feeId){

const res=await fetch(`${API_URL}/fees/create-order/${feeId}/`,{
method:"POST"
});

const data=await res.json();

const options={
key:data.key,
amount:data.amount,
currency:"INR",
order_id:data.order_id,
name:"CampusConnect",
description:"Hostel Fee Payment",
handler:async function(response){

await fetch(`${API_URL}/fees/verify-payment/`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
payment_id:response.razorpay_payment_id,
order_id:response.razorpay_order_id,
signature:response.razorpay_signature,
fee_id:feeId
})
});

alert("Payment Successful");
loadStudentFees();
}
};

const rzp=new Razorpay(options);
rzp.open();
}

/* ===== RECEIPT ===== */

function downloadReceipt(feeId){
window.open(`${API_URL}/fees/receipt/${feeId}/`);
}

</script>
</body>
</html>
