<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Notices - CampusConnect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>

<style>
  
    .brand-font {
font-family: "Bitcount Grid Double", system-ui;
font-size: medium;
font-weight: 100;
letter-spacing: 2px;
}
body {
font-family: 'Inter', sans-serif;
transition: background 0.3s ease, color 0.3s ease;
}

/* Sidebar */
#sidebar { width: 250px; }

/* Cards */
.card {
background: white;
border: 1px solid black;
border-radius: 12px;
padding: 1.25rem;
}

/* Scroll container */
.scroll-container {
max-height: 500px;
overflow-y: auto;
padding-right: 5px;
}

/* Buttons */
.button {
background: black;
color: white;
padding: 0.5rem 1rem;
border-radius: 8px;
transition: opacity 0.2s ease;
display: inline-block;
}

.button:hover { opacity: 0.85; }

/* Dark Mode */
.dark-mode {
background: #0f172a;
color: white;
}

.dark-mode .card {
background: #1e293b;
border: 1px solid black;
}
</style>
</head>

<body class="flex">

<script src="../js/app.js"></script>
<script>
checkAuthAndRedirect();
if (getUserRole() !== "student") {
window.location.href = "admin-dashboard.html";
}
</script>

<!-- Sidebar -->
<aside id="sidebar"
class="fixed top-0 left-0 h-full bg-black text-white p-6 flex flex-col justify-between transform transition-transform duration-300">

<div>
<div class="flex items-center gap-3 mb-8">
<img src="../assets/logo/lo.jpg" class="w-10 h-10 object-contain">
<span class="text-lg text-white brand-font">CampusConnect</span>
</div>

<nav class="flex flex-col gap-4">
<a href="student-dashboard.html">Dashboard</a>
<a href="student-rules.html">Rules</a>
<a href="student-fees.html">Fees</a>
<a href="student-notices.html" class="font-semibold">Notices</a>
<a href="student-complaints.html">Complaints</a>
</nav>
</div>

<button class="button mt-6" onclick="logout()">Logout</button>
</aside>

<!-- Main Content -->
<div id="mainContent" class="flex-1 ml-[250px] p-8 transition-all duration-300">

<!-- Top Bar -->
<div class="flex items-center mb-8 relative">
<button onclick="toggleSidebar()" class="button">☰</button>

<h1 class="absolute left-1/2 transform -translate-x-1/2 text-2xl font-semibold">
Notices
</h1>

<div class="ml-auto">
<label class="flex items-center cursor-pointer">
<input type="checkbox" id="themeToggle" class="hidden">
<div class="w-12 h-6 bg-gray-300 rounded-full relative transition">
<div id="toggleCircle"
class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition"></div>
</div>
</label>
</div>
</div>

<div id="error-container"></div>

<div id="loading" class="mb-4">Loading notices...</div>

<div class="scroll-container" id="notices-container"></div>

</div>

<script>

/* Sidebar Toggle */
const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");
let isOpen = true;

function toggleSidebar() {
if (isOpen) {
sidebar.style.transform = "translateX(-100%)";
mainContent.style.marginLeft = "0";
} else {
sidebar.style.transform = "translateX(0)";
mainContent.style.marginLeft = "250px";
}
isOpen = !isOpen;
}

/* Dark Mode */
const toggle = document.getElementById("themeToggle");
const circle = document.getElementById("toggleCircle");

toggle.addEventListener("change", () => {
document.body.classList.toggle("dark-mode");
circle.style.transform = toggle.checked ? "translateX(24px)" : "translateX(0)";
});

/* ===== ORIGINAL LOGIC (UNCHANGED) ===== */

setActiveNavLink("notices");

async function loadStudentNotices() {

try {

const response = await fetch(`${API_URL}/notices/`);

if (!response.ok) {
throw new Error("Failed to fetch notices");
}

const data = await response.json();

document.getElementById("loading").style.display = "none";

if (!data || data.length === 0) {
document.getElementById("notices-container").innerHTML = `
<div class="card text-center">
No notices available
</div>`;
return;
}

let html = '';

data.forEach(notice => {

html += `
<div class="card mb-4">
<h3 class="font-semibold">${notice.title || "-"}</h3>
<p class="text-sm text-gray-500 mb-2">
${formatDate(notice.created_at)}
</p>
<p>${notice.description || "-"}</p>
</div>
`;
});

document.getElementById("notices-container").innerHTML = html;

} catch (error) {

document.getElementById("loading").style.display = "none";
showError("Unable to load notices.");
console.error(error);

}
}

loadStudentNotices();

</script>

</body>
</html>
